[pytest]
addopts = -vs
norecursedirs = .git .venv .pytest_cache .understand-anything artifacts
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: core scenarios used for fast confidence checks
    regression: broader behavior coverage for scheduled or release runs
    login: authentication scenarios
    inventory: product inventory and sorting scenarios
    cart: shopping cart scenarios
    checkout: checkout form scenarios
    e2e: complete end-to-end business flows
